name: Release

# Push a tag like v0.1.0 to build and publish a release.
# Run it by hand (Actions > Release > Run workflow) to only build and check the archives.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev libxkbcommon-dev
      - name: Build
        run: cargo build --release --locked -p slipstream-cli -p slipstream-daemon -p slipstream-nmhost -p slipstream-gui --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "slipstream-${{ github.ref_name }}-${{ matrix.target }}" -replace '/', '-'
          New-Item -ItemType Directory $name | Out-Null
          $bin = "target/${{ matrix.target }}/release"
          Copy-Item "$bin/slipstream.exe", "$bin/slipstream-daemon.exe", "$bin/slipstream-nmhost.exe", "$bin/slipstream-gui.exe", README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          & "$name/slipstream.exe" --version
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="slipstream-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          bin=target/${{ matrix.target }}/release
          cp "$bin/slipstream" "$bin/slipstream-daemon" "$bin/slipstream-nmhost" "$bin/slipstream-gui" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          "$name/slipstream" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            slipstream-*.zip
            slipstream-*.tar.gz
            slipstream-*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease \
            --title "Slipstream $GITHUB_REF_NAME (preview)" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
