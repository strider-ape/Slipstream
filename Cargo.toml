[workspace]
resolver = "3"
# Throwaway UI prototypes build on their own (not in CI or releases).
exclude = ["prototypes"]
members = [
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/nmhost",
    "crates/gui",
    "tools/testserver",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/strider-ape/Slipstream"

[workspace.dependencies]
slipstream-core = { path = "crates/core" }
winresource = "0.1"

# Small, fast release binaries: whole-program optimisation, no debug symbols.
[profile.release]
# Smallest code: these programs wait on the network, not the CPU.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
