[package]
name = "slipstream-core"
description = "Segmented download engine for Slipstream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "macros", "net", "io-util", "sync"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[dev-dependencies]
testserver = { path = "../../tools/testserver" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
