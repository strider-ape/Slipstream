[package]
name = "slipstream-daemon"
description = "Slipstream background daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "slipstream-daemon"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
slipstream-core.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[dev-dependencies]
testserver = { path = "../../tools/testserver" }
