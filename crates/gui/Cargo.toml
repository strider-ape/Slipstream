[package]
name = "slipstream-gui"
description = "Slipstream desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "slipstream-gui"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
slipstream-core.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }

[build-dependencies]
slint-build = "1.18.1"
