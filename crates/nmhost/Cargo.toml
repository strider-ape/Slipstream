[package]
name = "slipstream-nmhost"
description = "Slipstream native messaging host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "slipstream-nmhost"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slipstream-core.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util"] }

[dev-dependencies]
slipstream-daemon = { path = "../daemon" }
testserver = { path = "../../tools/testserver" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }

[build-dependencies]
winresource.workspace = true
