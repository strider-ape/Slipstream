[package]
name = "testserver"
description = "Local HTTP server for engine tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "testserver"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "form"] }
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
